name: Update spa stock

on:
  schedule:
    # Quarter-hour cadence, offset from the busiest minute of the hour.
    # GitHub schedules are best-effort; workflow_dispatch supports an external timer.
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
  # Validate changes to the updater by immediately refreshing the stock.
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-spa-stock.yml'
      - 'scripts/update-spa-stock.ps1'
      - 'scripts/publish-spa-stock.sh'
      - 'tests/container-arrivals.test.ps1'

permissions:
  contents: write

concurrency:
  group: update-spa-stock-main
  cancel-in-progress: false

jobs:
  update:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          # A rerun must refresh stock against today's code, not its original SHA.
          ref: main

      - name: Test container arrival parsing
        shell: pwsh
        run: .\tests\container-arrivals.test.ps1

      - name: Build stock JSON
        shell: pwsh
        env:
          SUNSPA_DEALER_PASSWORD: ${{ secrets.SUNSPA_DEALER_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            try {
              $json = .\scripts\update-spa-stock.ps1 | Out-String
              $stock = $json | ConvertFrom-Json
              if (-not $stock.generatedAt -or $null -eq $stock.models) {
                throw 'Stock output is missing generatedAt or models.'
              }
              $json | Set-Content -LiteralPath .\spa-stock.json -Encoding utf8
              break
            } catch {
              if ($attempt -eq 3) { throw }
              Write-Warning "Stock refresh attempt $attempt failed; retrying in 20 seconds."
              Start-Sleep -Seconds 20
            }
          }

      - name: Commit stock JSON when changed
        shell: bash
        run: bash scripts/publish-spa-stock.sh
